---
test_id: "{{ tiny_prefix }}"
image_name: "test-sm-image-version-{{ test_id }}"
image_role_name: "ansible-test-sagemaker-image-version-role-{{ test_id }}"
# SageMaker requires a Docker V2 manifest (OCI manifests are rejected). The test creates
# the ECR repo and pushes a Docker V2 image via skopeo (installed inside the test container)
# at the start of the test run.
image_version_ecr_repository_name: "ansible-test-sm-image-version-{{ test_id }}"
# Resolved at runtime from aws_account_id in tasks/main.yml.
image_version_base_image: "{{ aws_account_id }}.dkr.ecr.{{ aws_region }}.amazonaws.com/{{ image_version_ecr_repository_name }}:latest"

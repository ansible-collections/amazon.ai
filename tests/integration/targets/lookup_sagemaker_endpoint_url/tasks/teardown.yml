---
- name: Delete endpoints
  amazon.ai.sagemaker_endpoint:
    state: absent
    endpoint_name: "{{ item }}"
  loop:
    - "{{ endpoint_a_name }}"
    - "{{ endpoint_b_name }}"
  ignore_errors: true

- name: Delete endpoint configuration
  amazon.ai.sagemaker_endpoint_config:
    state: absent
    endpoint_config_name: "{{ endpoint_config_name }}"
  ignore_errors: true

- name: Delete SageMaker model
  amazon.ai.sagemaker_model:
    state: absent
    model_name: "{{ model_name }}"
  ignore_errors: true

- name: Delete S3 bucket
  amazon.aws.s3_bucket:
    name: "{{ model_bucket_name }}"
    state: absent
    force: true
  ignore_errors: true

- name: Delete IAM roles
  amazon.aws.iam_role:
    name: "{{ item }}"
    state: absent
  loop:
    - "{{ model_role_name }}"
    - "{{ denied_role_name }}"
  ignore_errors: true

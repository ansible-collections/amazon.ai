---
- name: Fail early when the region has no mapped XGBoost image
  ansible.builtin.assert:
    that:
      - aws_region in sagemaker_xgboost_accounts
    fail_msg: >-
      No SageMaker XGBoost image account mapped for region '{{ aws_region }}'.
      Add it to sagemaker_xgboost_accounts in defaults/main.yml.

- name: Get AWS caller info
  amazon.aws.aws_caller_info:
  register: caller_info

- name: Create IAM role for SageMaker Model
  amazon.aws.iam_role:
    name: "{{ model_role_name }}"
    assume_role_policy_document: "{{ lookup('file', 'assume_role_sagemaker_model.json') }}"
    state: present
    managed_policies:
      - "arn:aws:iam::aws:policy/AmazonSageMakerFullAccess"
  register: model_role

# Assumed by the on_denied tests: it has no permissions, so DescribeEndpoint is denied.
- name: Create IAM role without SageMaker permissions
  amazon.aws.iam_role:
    name: "{{ denied_role_name }}"
    assume_role_policy_document: "{{ denied_role_trust_policy | to_json }}"
    state: present
  vars:
    denied_role_trust_policy:
      Version: "2012-10-17"
      Statement:
        - Effect: Allow
          Principal:
            AWS: "arn:aws:iam::{{ caller_info.account }}:root"
          Action: sts:AssumeRole
  register: denied_role

- name: Wait for IAM roles to propagate
  ansible.builtin.pause:
    seconds: 15

- name: Create S3 bucket for model artifacts
  amazon.aws.s3_bucket:
    name: "{{ model_bucket_name }}"
    state: present

- name: Upload model artifact to S3
  amazon.aws.s3_object:
    bucket: "{{ model_bucket_name }}"
    object: model.tar.gz
    src: "{{ role_path }}/files/model.tar.gz"
    mode: put

- name: Create SageMaker model
  amazon.ai.sagemaker_model:
    state: present
    model_name: "{{ model_name }}"
    execution_role_arn: "{{ model_role.iam_role.arn }}"
    primary_container:
      image: "{{ model_image }}"
      model_data_url: "{{ model_data_url }}"

- name: Create endpoint configuration
  amazon.ai.sagemaker_endpoint_config:
    endpoint_config_name: "{{ endpoint_config_name }}"
    production_variants:
      - variant_name: AllTraffic
        model_name: "{{ model_name }}"
        initial_instance_count: 1
        instance_type: ml.m5.large

# Both endpoints are created without waiting so they provision in parallel.
- name: Create endpoints
  amazon.ai.sagemaker_endpoint:
    endpoint_name: "{{ item }}"
    endpoint_config_name: "{{ endpoint_config_name }}"
    wait: false
  loop:
    - "{{ endpoint_a_name }}"
    - "{{ endpoint_b_name }}"

- name: Wait for endpoints to leave the Creating state
  amazon.ai.sagemaker_endpoint_info:
    endpoint_name: "{{ item }}"
  register: endpoint_info
  until: endpoint_info.endpoints | length == 1 and endpoint_info.endpoints[0].endpoint_status in ['InService', 'Failed']
  retries: 60
  delay: 20
  loop:
    - "{{ endpoint_a_name }}"
    - "{{ endpoint_b_name }}"

- name: Assert endpoints are in service
  ansible.builtin.assert:
    that:
      - endpoint_info.results | map(attribute='endpoints') | flatten | map(attribute='endpoint_status') | list == ['InService', 'InService']

- name: Assume the role without SageMaker permissions
  amazon.aws.sts_assume_role:
    role_arn: "{{ denied_role.iam_role.arn }}"
    role_session_name: "{{ test_id }}-denied"
  register: denied_session
  # A freshly created role can take a while before it can be assumed.
  until: denied_session is successful
  retries: 10
  delay: 10
  no_log: true

- name: Set connection arguments for the denied role
  ansible.builtin.set_fact:
    denied_connection_args:
      region: "{{ aws_region }}"
      access_key: "{{ denied_session.sts_creds.access_key }}"
      secret_key: "{{ denied_session.sts_creds.secret_key }}"
      session_token: "{{ denied_session.sts_creds.session_token }}"
  no_log: true

---
- name: Amazon Bedrock AgentCore Runtime integration tests
  module_defaults:
    group/amazon.ai.aws:
      access_key: "{{ aws_access_key }}"
      secret_key: "{{ aws_secret_key }}"
      session_token: "{{ security_token | default(omit) }}"
      region: "{{ aws_region }}"
    group/aws:
      access_key: "{{ aws_access_key }}"
      secret_key: "{{ aws_secret_key }}"
      session_token: "{{ security_token | default(omit) }}"
      region: "{{ aws_region }}"
  block:
    # Setup: Create IAM role for AgentCore Runtime
    - name: Create IAM role for Bedrock AgentCore Runtime
      amazon.aws.iam_role:
        name: "{{ agent_runtime_role_name }}"
        assume_role_policy_document: "{{ lookup('file', 'assume_role_bedrock_agentcore.json') }}"
        state: present
        managed_policies:
          - "arn:aws:iam::aws:policy/AmazonBedrockFullAccess"
      register: runtime_role

    - name: Save role ARN
      ansible.builtin.set_fact:
        runtime_role_arn: "{{ runtime_role.iam_role.arn }}"

    - name: Wait for IAM role to propagate
      ansible.builtin.pause:
        seconds: 15
        prompt: "Waiting for IAM role to be fully propagated."

    # Scenario 1: Create runtime - check mode
    - name: "Scenario 1: Create AgentCore runtime (check mode)"
      amazon.ai.bedrock_agentcore_runtime:
        state: present
        agent_runtime_name: "{{ agent_runtime_name }}"
        container_configuration:
          container_uri: "{{ container_uri }}"
        role_arn: "{{ runtime_role_arn }}"
        network_mode: "{{ network_mode }}"
        protocol: HTTP
        tags:
          Environment: integration-test
        environment_variables:
          LOG_LEVEL: INFO
        session_storage:
          mount_path: "{{ create_session_storage_mount_path }}"
        authorizer_discovery_url: "{{ authorizer_discovery_url }}"
        authorizer_allowed_audience: "{{ authorizer_allowed_audience }}"
        authorizer_allowed_clients: "{{ authorizer_allowed_clients }}"
        authorizer_allowed_scopes: "{{ authorizer_allowed_scopes }}"
      check_mode: true
      register: runtime_create_check

    - name: "Scenario 1: Assert runtime creation check mode"
      ansible.builtin.assert:
        that:
          - runtime_create_check.changed
          - "'Check mode: would have created agent runtime' in runtime_create_check.msg"

    # Scenario 2: Create runtime - real
    - name: "Scenario 2: Create AgentCore runtime (real)"
      amazon.ai.bedrock_agentcore_runtime:
        state: present
        agent_runtime_name: "{{ agent_runtime_name }}"
        container_configuration:
          container_uri: "{{ container_uri }}"
        role_arn: "{{ runtime_role_arn }}"
        network_mode: "{{ network_mode }}"
        protocol: HTTP
        tags:
          Environment: integration-test
        environment_variables:
          LOG_LEVEL: INFO
        session_storage:
          mount_path: "{{ create_session_storage_mount_path }}"
        authorizer_discovery_url: "{{ authorizer_discovery_url }}"
        authorizer_allowed_audience: "{{ authorizer_allowed_audience }}"
        authorizer_allowed_clients: "{{ authorizer_allowed_clients }}"
        authorizer_allowed_scopes: "{{ authorizer_allowed_scopes }}"
      register: runtime_create_real

    - name: "Scenario 2: Assert runtime creation real"
      ansible.builtin.assert:
        that:
          - runtime_create_real.changed
          - runtime_create_real.agent_runtime.status == "READY"
          - runtime_create_real.agent_runtime.agent_runtime_arn is defined
          - runtime_create_real.agent_runtime.protocol_configuration.server_protocol == "HTTP"
          - runtime_create_real.agent_runtime.environment_variables.LOG_LEVEL == "INFO"
          - runtime_create_real.agent_runtime.filesystem_configurations[0].session_storage.mount_path == create_session_storage_mount_path
          - runtime_create_real.agent_runtime.authorizer_configuration.custom_jwt_authorizer.discovery_url == authorizer_discovery_url
          - runtime_create_real.agent_runtime.authorizer_configuration.custom_jwt_authorizer.allowed_audience == authorizer_allowed_audience
          - runtime_create_real.agent_runtime.authorizer_configuration.custom_jwt_authorizer.allowed_clients == authorizer_allowed_clients
          - runtime_create_real.agent_runtime.authorizer_configuration.custom_jwt_authorizer.allowed_scopes == authorizer_allowed_scopes

    - name: "Scenario 2: Save runtime ID for later use"
      ansible.builtin.set_fact:
        runtime_id: "{{ runtime_create_real.agent_runtime.agent_runtime_id }}"

    # Scenario 3: Create runtime - rerun (idempotency)
    - name: "Scenario 3: Create AgentCore runtime (rerun - check mode)"
      amazon.ai.bedrock_agentcore_runtime:
        state: present
        agent_runtime_name: "{{ agent_runtime_name }}"
        container_configuration:
          container_uri: "{{ container_uri }}"
        role_arn: "{{ runtime_role_arn }}"
        network_mode: "{{ network_mode }}"
        protocol: HTTP
        tags:
          Environment: integration-test
        environment_variables:
          LOG_LEVEL: INFO
        session_storage:
          mount_path: "{{ create_session_storage_mount_path }}"
        authorizer_discovery_url: "{{ authorizer_discovery_url }}"
        authorizer_allowed_audience: "{{ authorizer_allowed_audience }}"
        authorizer_allowed_clients: "{{ authorizer_allowed_clients }}"
        authorizer_allowed_scopes: "{{ authorizer_allowed_scopes }}"
      check_mode: true
      register: runtime_create_rerun_check

    - name: "Scenario 3: Assert runtime creation rerun check mode idempotency"
      ansible.builtin.assert:
        that:
          - not runtime_create_rerun_check.changed

    - name: "Scenario 3: Create AgentCore runtime (rerun - real)"
      amazon.ai.bedrock_agentcore_runtime:
        state: present
        agent_runtime_name: "{{ agent_runtime_name }}"
        container_configuration:
          container_uri: "{{ container_uri }}"
        role_arn: "{{ runtime_role_arn }}"
        network_mode: "{{ network_mode }}"
        protocol: HTTP
        tags:
          Environment: integration-test
        environment_variables:
          LOG_LEVEL: INFO
        session_storage:
          mount_path: "{{ create_session_storage_mount_path }}"
        authorizer_discovery_url: "{{ authorizer_discovery_url }}"
        authorizer_allowed_audience: "{{ authorizer_allowed_audience }}"
        authorizer_allowed_clients: "{{ authorizer_allowed_clients }}"
        authorizer_allowed_scopes: "{{ authorizer_allowed_scopes }}"
      register: runtime_create_rerun_real

    - name: "Scenario 3: Assert runtime creation rerun real idempotency"
      ansible.builtin.assert:
        that:
          - not runtime_create_rerun_real.changed

    # Scenario 4: Info module - get runtime by name
    - name: "Scenario 4: Get AgentCore runtime info"
      amazon.ai.bedrock_agentcore_runtime_info:
        agent_runtime_name: "{{ agent_runtime_name }}"
      register: runtime_info

    - name: "Scenario 4: Assert runtime info"
      ansible.builtin.assert:
        that:
          - runtime_info.agent_runtimes is defined
          - runtime_info.agent_runtimes | length == 1
          - runtime_info.agent_runtimes[0].status == "READY"
          - runtime_info.agent_runtimes[0].agent_runtime_name == agent_runtime_name
          - runtime_info.agent_runtimes[0].protocol_configuration.server_protocol == "HTTP"
          - runtime_info.agent_runtimes[0].environment_variables.LOG_LEVEL == "INFO"
          - runtime_info.agent_runtimes[0].authorizer_configuration.custom_jwt_authorizer.discovery_url == authorizer_discovery_url
          - runtime_info.agent_runtimes[0].authorizer_configuration.custom_jwt_authorizer.allowed_audience == authorizer_allowed_audience
          - runtime_info.agent_runtimes[0].authorizer_configuration.custom_jwt_authorizer.allowed_clients == authorizer_allowed_clients
          - runtime_info.agent_runtimes[0].authorizer_configuration.custom_jwt_authorizer.allowed_scopes == authorizer_allowed_scopes

    # Scenario 5: Update runtime - check mode
    - name: "Scenario 5: Update AgentCore runtime description (check mode)"
      amazon.ai.bedrock_agentcore_runtime:
        state: present
        agent_runtime_name: "{{ agent_runtime_name }}"
        container_configuration:
          container_uri: "{{ container_uri }}"
        role_arn: "{{ runtime_role_arn }}"
        description: "Updated runtime description"
        network_mode: "{{ network_mode }}"
        protocol: MCP
        environment_variables:
          LOG_LEVEL: DEBUG
        session_storage:
          mount_path: "{{ update_session_storage_mount_path }}"
        authorizer_discovery_url: "{{ update_authorizer_discovery_url }}"
        authorizer_allowed_audience: "{{ update_authorizer_allowed_audience }}"
        authorizer_allowed_clients: "{{ update_authorizer_allowed_clients }}"
        authorizer_allowed_scopes: "{{ update_authorizer_allowed_scopes }}"
      check_mode: true
      register: runtime_update_check

    - name: "Scenario 5: Assert runtime update check mode"
      ansible.builtin.assert:
        that:
          - runtime_update_check.changed
          - "'Check mode: would have updated agent runtime' in runtime_update_check.msg"

    # Scenario 5: Update runtime - real
    - name: "Scenario 5: Update AgentCore runtime description (real)"
      amazon.ai.bedrock_agentcore_runtime:
        state: present
        agent_runtime_name: "{{ agent_runtime_name }}"
        container_configuration:
          container_uri: "{{ container_uri }}"
        role_arn: "{{ runtime_role_arn }}"
        description: "Updated runtime description"
        network_mode: "{{ network_mode }}"
        protocol: MCP
        environment_variables:
          LOG_LEVEL: DEBUG
        session_storage:
          mount_path: "{{ update_session_storage_mount_path }}"
        authorizer_discovery_url: "{{ update_authorizer_discovery_url }}"
        authorizer_allowed_audience: "{{ update_authorizer_allowed_audience }}"
        authorizer_allowed_clients: "{{ update_authorizer_allowed_clients }}"
        authorizer_allowed_scopes: "{{ update_authorizer_allowed_scopes }}"
      register: runtime_update_real

    - name: "Scenario 5: Assert runtime update real"
      ansible.builtin.assert:
        that:
          - runtime_update_real.changed
          - runtime_update_real.agent_runtime.description == "Updated runtime description"
          - runtime_update_real.agent_runtime.status == "READY"
          - runtime_update_real.agent_runtime.protocol_configuration.server_protocol == "MCP"
          - runtime_update_real.agent_runtime.environment_variables.LOG_LEVEL == "DEBUG"
          - runtime_update_real.agent_runtime.filesystem_configurations[0].session_storage.mount_path == update_session_storage_mount_path
          - runtime_update_real.agent_runtime.authorizer_configuration.custom_jwt_authorizer.discovery_url == update_authorizer_discovery_url
          - runtime_update_real.agent_runtime.authorizer_configuration.custom_jwt_authorizer.allowed_audience == update_authorizer_allowed_audience
          - runtime_update_real.agent_runtime.authorizer_configuration.custom_jwt_authorizer.allowed_clients == update_authorizer_allowed_clients
          - runtime_update_real.agent_runtime.authorizer_configuration.custom_jwt_authorizer.allowed_scopes == update_authorizer_allowed_scopes

    # Scenario 5: Update runtime - rerun (idempotency)
    - name: "Scenario 5: Update AgentCore runtime description (rerun)"
      amazon.ai.bedrock_agentcore_runtime:
        state: present
        agent_runtime_name: "{{ agent_runtime_name }}"
        container_configuration:
          container_uri: "{{ container_uri }}"
        role_arn: "{{ runtime_role_arn }}"
        description: "Updated runtime description"
        network_mode: "{{ network_mode }}"
        protocol: MCP
        environment_variables:
          LOG_LEVEL: DEBUG
        session_storage:
          mount_path: "{{ update_session_storage_mount_path }}"
        authorizer_discovery_url: "{{ update_authorizer_discovery_url }}"
        authorizer_allowed_audience: "{{ update_authorizer_allowed_audience }}"
        authorizer_allowed_clients: "{{ update_authorizer_allowed_clients }}"
        authorizer_allowed_scopes: "{{ update_authorizer_allowed_scopes }}"
      register: runtime_update_rerun

    - name: "Scenario 5: Assert runtime update rerun idempotency"
      ansible.builtin.assert:
        that:
          - not runtime_update_rerun.changed

    - name: "Scenario 5: Get updated AgentCore runtime info"
      amazon.ai.bedrock_agentcore_runtime_info:
        agent_runtime_name: "{{ agent_runtime_name }}"
      register: runtime_updated_info

    - name: "Scenario 5: Assert updated runtime info"
      ansible.builtin.assert:
        that:
          - runtime_updated_info.agent_runtimes | length == 1
          - runtime_updated_info.agent_runtimes[0].agent_runtime_arn == runtime_create_real.agent_runtime.agent_runtime_arn
          - runtime_updated_info.agent_runtimes[0].protocol_configuration.server_protocol == "MCP"
          - runtime_updated_info.agent_runtimes[0].environment_variables.LOG_LEVEL == "DEBUG"
          - runtime_updated_info.agent_runtimes[0].filesystem_configurations[0].session_storage.mount_path == update_session_storage_mount_path
          - runtime_updated_info.agent_runtimes[0].authorizer_configuration.custom_jwt_authorizer.discovery_url == update_authorizer_discovery_url
          - runtime_updated_info.agent_runtimes[0].authorizer_configuration.custom_jwt_authorizer.allowed_audience == update_authorizer_allowed_audience
          - runtime_updated_info.agent_runtimes[0].authorizer_configuration.custom_jwt_authorizer.allowed_clients == update_authorizer_allowed_clients
          - runtime_updated_info.agent_runtimes[0].authorizer_configuration.custom_jwt_authorizer.allowed_scopes == update_authorizer_allowed_scopes

    # Scenario 9: Failure - both artifact types set
    - name: "Scenario 9: Attempt to create runtime with both artifact types"
      amazon.ai.bedrock_agentcore_runtime:
        state: present
        agent_runtime_name: "test_both_artifacts_{{ test_id }}"
        container_configuration:
          container_uri: "{{ container_uri }}"
        code_configuration:
          s3_bucket: "bucket"
          s3_prefix: "prefix"
          runtime: "PYTHON_3_11"
          entry_point: ["handler.py"]
        role_arn: "{{ runtime_role_arn }}"
        network_mode: "{{ network_mode }}"
      register: both_artifacts_result
      ignore_errors: true

    - name: "Scenario 9: Assert failure - both artifact types"
      ansible.builtin.assert:
        that:
          - both_artifacts_result is failed

    # Scenario 12: Delete runtime - check mode
    - name: "Scenario 12: Delete runtime (check mode)"
      amazon.ai.bedrock_agentcore_runtime:
        state: absent
        agent_runtime_name: "{{ agent_runtime_name }}"
      check_mode: true
      register: runtime_delete_check

    - name: "Scenario 12: Assert runtime delete check mode"
      ansible.builtin.assert:
        that:
          - runtime_delete_check.changed
          - "'Check mode: would have deleted agent runtime' in runtime_delete_check.msg"

    # Scenario 12: Delete runtime - real
    - name: "Scenario 12: Delete runtime (real)"
      amazon.ai.bedrock_agentcore_runtime:
        state: absent
        agent_runtime_name: "{{ agent_runtime_name }}"
      register: runtime_delete_real

    - name: "Scenario 12: Assert runtime delete real"
      ansible.builtin.assert:
        that:
          - runtime_delete_real.changed

    # Scenario 12: Delete runtime - rerun (already absent)
    - name: "Scenario 12: Delete runtime (rerun - already absent)"
      amazon.ai.bedrock_agentcore_runtime:
        state: absent
        agent_runtime_name: "{{ agent_runtime_name }}"
      register: runtime_delete_rerun

    - name: "Scenario 12: Assert runtime delete rerun idempotency"
      ansible.builtin.assert:
        that:
          - not runtime_delete_rerun.changed

  always:
    # Teardown - cleanup resources in reverse order with ignore_errors
    - name: "Teardown: Delete runtime"
      amazon.ai.bedrock_agentcore_runtime:
        state: absent
        agent_runtime_name: "{{ agent_runtime_name }}"
      ignore_errors: true

    - name: "Teardown: Delete IAM role"
      amazon.aws.iam_role:
        name: "{{ agent_runtime_role_name }}"
        state: absent
      ignore_errors: true

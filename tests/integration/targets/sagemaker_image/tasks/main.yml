---
- name: SageMaker Image integration tests
  module_defaults:
    group/amazon.ai.aws:
      access_key: "{{ aws_access_key }}"
      secret_key: "{{ aws_secret_key }}"
      session_token: "{{ security_token | default(omit) }}"
      region: "{{ aws_region }}"
    group/aws:
      access_key: "{{ aws_access_key }}"
      secret_key: "{{ aws_secret_key }}"
      session_token: "{{ security_token | default(omit) }}"
      region: "{{ aws_region }}"
  block:
    # -------------------------------------------------------
    # SETUP — IAM role
    # -------------------------------------------------------
    - name: Create IAM role for SageMaker Image
      amazon.aws.iam_role:
        name: "{{ image_role_name }}"
        assume_role_policy_document: "{{ lookup('file', 'assume_role_sagemaker.json') }}"
        state: present
        managed_policies:
          - "arn:aws:iam::aws:policy/AmazonSageMakerFullAccess"
      register: image_role

    - name: Save role ARN
      ansible.builtin.set_fact:
        image_role_arn: "{{ image_role.iam_role.arn }}"

    - name: Wait for IAM role to propagate
      ansible.builtin.pause:
        seconds: 15
        prompt: "Waiting for IAM role to be fully propagated."

    # -------------------------------------------------------
    # FAILURE PATH — state=present without role_arn
    # -------------------------------------------------------
    - name: Create SageMaker Image without role_arn (expected failure)
      amazon.ai.sagemaker_image:
        state: present
        image_name: "{{ image_name }}"
      register: image_no_role
      ignore_errors: true

    - name: Assert missing role_arn fails
      ansible.builtin.assert:
        that:
          - image_no_role.failed

    # -------------------------------------------------------
    # CREATE — check_mode
    # -------------------------------------------------------
    - name: Create SageMaker Image (check_mode)
      amazon.ai.sagemaker_image:
        state: present
        image_name: "{{ image_name }}"
        role_arn: "{{ image_role_arn }}"
        wait_timeout: 120
      check_mode: true
      register: image_create_check

    - name: Assert check_mode reports changed
      ansible.builtin.assert:
        that:
          - image_create_check.changed
          - "'Check mode' in image_create_check.msg"

    - name: Confirm the image was not actually created
      amazon.ai.sagemaker_image_info:
        image_name: "{{ image_name }}"
      register: image_info_absent

    - name: Assert image is absent after check_mode create
      ansible.builtin.assert:
        that:
          - not image_info_absent.failed
          - image_info_absent.images | length == 0

    # -------------------------------------------------------
    # CREATE — actual
    # -------------------------------------------------------
    - name: Create SageMaker Image (First Run)
      amazon.ai.sagemaker_image:
        state: present
        image_name: "{{ image_name }}"
        role_arn: "{{ image_role_arn }}"
        wait_timeout: 120
      register: image_create_first

    - name: Assert image was created
      ansible.builtin.assert:
        that:
          - image_create_first.changed
          - "'created successfully' in image_create_first.msg"
          - image_create_first.image.image_arn is defined
          - image_create_first.image.image_status == "CREATED"

    # -------------------------------------------------------
    # CREATE — rerun (idempotency)
    # -------------------------------------------------------
    - name: Create SageMaker Image (Second Run - Idempotency)
      amazon.ai.sagemaker_image:
        state: present
        image_name: "{{ image_name }}"
        role_arn: "{{ image_role_arn }}"
        wait_timeout: 120
      register: image_create_second

    - name: Assert idempotency
      ansible.builtin.assert:
        that:
          - not image_create_second.changed
          - image_create_second.image.image_name == image_name

    # -------------------------------------------------------
    # INFO — get specific image
    # -------------------------------------------------------
    - name: Get info about the created image
      amazon.ai.sagemaker_image_info:
        image_name: "{{ image_name }}"
      register: image_info

    - name: Assert info module returns the image
      ansible.builtin.assert:
        that:
          - image_info.images | length == 1
          - image_info.images[0].image_name == image_name
          - image_info.images[0].image_status == "CREATED"
          - "'role_arn' not in image_info.images[0]"

    # -------------------------------------------------------
    # ALIAS — `name` alias for `image_name`
    # -------------------------------------------------------
    - name: Get info about the created image using the name alias
      amazon.ai.sagemaker_image_info:
        name: "{{ image_name }}"
      register: image_info_by_alias

    - name: Assert name alias returns the same image as image_name
      ansible.builtin.assert:
        that:
          - image_info_by_alias.images | length == 1
          - image_info_by_alias.images[0].image_arn == image_info.images[0].image_arn

    - name: Re-run create using the name alias (idempotency)
      amazon.ai.sagemaker_image:
        state: present
        name: "{{ image_name }}"
        role_arn: "{{ image_role_arn }}"
        wait_timeout: 120
      register: image_create_by_alias

    - name: Assert name alias resolves to the same resource and stays idempotent
      ansible.builtin.assert:
        that:
          - not image_create_by_alias.changed
          - image_create_by_alias.image.image_arn == image_info.images[0].image_arn

    # -------------------------------------------------------
    # INFO — image that does not exist
    # -------------------------------------------------------
    - name: Get info about a non-existent image
      amazon.ai.sagemaker_image_info:
        image_name: "does-not-exist-{{ test_id }}"
      register: image_info_missing

    - name: Assert missing image is non-fatal and returns an empty list
      ansible.builtin.assert:
        that:
          - not image_info_missing.failed
          - image_info_missing.images == []

    # -------------------------------------------------------
    # INFO — list with name_contains filter
    # -------------------------------------------------------
    - name: List images filtered by name
      amazon.ai.sagemaker_image_info:
        name_contains: "{{ test_id }}"
      register: image_info_filtered

    - name: Assert filtered results contain our image
      ansible.builtin.assert:
        that:
          - image_info_filtered.images | length >= 1
          - image_name in (image_info_filtered.images | map(attribute='image_name') | list)

    # -------------------------------------------------------
    # INFO — list all images
    # -------------------------------------------------------
    - name: List all SageMaker Images
      amazon.ai.sagemaker_image_info:
      register: image_info_all

    - name: Assert all-images list contains our image
      ansible.builtin.assert:
        that:
          - image_info_all.images | length >= 1
          - image_name in (image_info_all.images | map(attribute='image_name') | list)

    # -------------------------------------------------------
    # INFO — image_name combined with a filter (mutually exclusive)
    # -------------------------------------------------------
    - name: List images with image_name and name_contains together (expected failure)
      amazon.ai.sagemaker_image_info:
        image_name: "{{ image_name }}"
        name_contains: "{{ test_id }}"
      register: image_info_mutex
      ignore_errors: true

    - name: Assert mutually exclusive parameters fail
      ansible.builtin.assert:
        that:
          - image_info_mutex.failed

    # -------------------------------------------------------
    # INFO — sort_by / sort_order
    # -------------------------------------------------------
    - name: Create a second SageMaker Image for sort validation
      amazon.ai.sagemaker_image:
        state: present
        image_name: "{{ image_name }}-sort"
        role_arn: "{{ image_role_arn }}"
        wait_timeout: 120
      register: image_sort_peer

    - name: Assert secondary image was created
      ansible.builtin.assert:
        that:
          - image_sort_peer.changed
          - image_sort_peer.image.image_name == image_name ~ '-sort'

    - name: List images sorted by name ascending
      amazon.ai.sagemaker_image_info:
        sort_by: "IMAGE_NAME"
        sort_order: "ASCENDING"
      register: image_info_sorted

    - name: Assert sorted listing orders the two test images correctly
      ansible.builtin.assert:
        that:
          - image_info_sorted.images | length >= 2
          - (image_info_sorted.images | map(attribute='image_name') | list).index(image_name) < (image_info_sorted.images | map(attribute='image_name') | list).index(image_name ~ '-sort')

    # -------------------------------------------------------
    # UPDATE — check_mode
    # -------------------------------------------------------
    - name: Update SageMaker Image display_name/description (check_mode)
      amazon.ai.sagemaker_image:
        state: present
        image_name: "{{ image_name }}"
        role_arn: "{{ image_role_arn }}"
        display_name: "My Test Image"
        description: "A test image"
        wait_timeout: 120
      check_mode: true
      register: image_update_check

    - name: Assert update check_mode reports changed
      ansible.builtin.assert:
        that:
          - image_update_check.changed
          - "'Check mode' in image_update_check.msg"

    # -------------------------------------------------------
    # UPDATE — actual
    # -------------------------------------------------------
    - name: Update SageMaker Image display_name/description
      amazon.ai.sagemaker_image:
        state: present
        image_name: "{{ image_name }}"
        role_arn: "{{ image_role_arn }}"
        display_name: "My Test Image"
        description: "A test image"
        wait_timeout: 120
      register: image_update

    - name: Assert image was updated
      ansible.builtin.assert:
        that:
          - image_update.changed
          - image_update.image.display_name == "My Test Image"
          - image_update.image.description == "A test image"

    - name: Get info about the updated image
      amazon.ai.sagemaker_image_info:
        image_name: "{{ image_name }}"
      register: image_info_updated

    - name: Assert update kept the same image
      ansible.builtin.assert:
        that:
          - image_info_updated.images | length == 1
          - image_info_updated.images[0].image_arn == image_create_first.image.image_arn

    # -------------------------------------------------------
    # UPDATE — rerun (idempotency)
    # -------------------------------------------------------
    - name: Update SageMaker Image (Second Run - Idempotency)
      amazon.ai.sagemaker_image:
        state: present
        image_name: "{{ image_name }}"
        role_arn: "{{ image_role_arn }}"
        display_name: "My Test Image"
        description: "A test image"
        wait_timeout: 120
      register: image_update_second

    - name: Assert update idempotency
      ansible.builtin.assert:
        that:
          - not image_update_second.changed

    # -------------------------------------------------------
    # TAGS — add
    # -------------------------------------------------------
    - name: Add tags to SageMaker Image
      amazon.ai.sagemaker_image:
        state: present
        image_name: "{{ image_name }}"
        role_arn: "{{ image_role_arn }}"
        tags:
          Environment: test
          Purpose: ansible-integration-test
        wait_timeout: 120
      register: image_tags_add

    - name: Assert tags were added
      ansible.builtin.assert:
        that:
          - image_tags_add.changed
          - image_tags_add.image.tags.Environment == "test"
          - image_tags_add.image.tags.Purpose == "ansible-integration-test"

    - name: Add tags to SageMaker Image (rerun - idempotency)
      amazon.ai.sagemaker_image:
        state: present
        image_name: "{{ image_name }}"
        role_arn: "{{ image_role_arn }}"
        tags:
          Environment: test
          Purpose: ansible-integration-test
        wait_timeout: 120
      register: image_tags_add_second

    - name: Assert tag idempotency
      ansible.builtin.assert:
        that:
          - not image_tags_add_second.changed

    # -------------------------------------------------------
    # TAGS — remove via purge_tags
    # -------------------------------------------------------
    - name: Remove a tag via purge_tags
      amazon.ai.sagemaker_image:
        state: present
        image_name: "{{ image_name }}"
        role_arn: "{{ image_role_arn }}"
        tags:
          Environment: test
        purge_tags: true
        wait_timeout: 120
      register: image_tags_remove

    - name: Assert removed tag no longer present
      ansible.builtin.assert:
        that:
          - image_tags_remove.changed
          - "'Purpose' not in image_tags_remove.image.tags"
          - image_tags_remove.image.tags.Environment == "test"

    # -------------------------------------------------------
    # DELETE — check_mode
    # -------------------------------------------------------
    - name: Delete SageMaker Image (check_mode)
      amazon.ai.sagemaker_image:
        state: absent
        image_name: "{{ image_name }}"
        wait_timeout: 120
      check_mode: true
      register: image_delete_check

    - name: Assert delete check_mode reports changed
      ansible.builtin.assert:
        that:
          - image_delete_check.changed
          - "'Check mode' in image_delete_check.msg"

    - name: Confirm the image still exists after check_mode delete
      amazon.ai.sagemaker_image_info:
        image_name: "{{ image_name }}"
      register: image_info_still_present

    - name: Assert image still present
      ansible.builtin.assert:
        that:
          - image_info_still_present.images | length == 1

    # -------------------------------------------------------
    # DELETE — actual
    # -------------------------------------------------------
    - name: Delete SageMaker Image (First Run)
      amazon.ai.sagemaker_image:
        state: absent
        image_name: "{{ image_name }}-sort"
        wait_timeout: 120
      register: image_delete_sort_peer

    - name: Delete SageMaker Image (Second Run)
      amazon.ai.sagemaker_image:
        state: absent
        image_name: "{{ image_name }}"
        wait_timeout: 120
      register: image_delete_first

    - name: Assert images were deleted
      ansible.builtin.assert:
        that:
          - image_delete_sort_peer.changed
          - image_delete_first.changed
          - "'deleted successfully' in image_delete_first.msg"

    - name: Confirm the image is gone
      amazon.ai.sagemaker_image_info:
        image_name: "{{ image_name }}"
      register: image_info_deleted

    - name: Assert image no longer found
      ansible.builtin.assert:
        that:
          - not image_info_deleted.failed
          - image_info_deleted.images | length == 0

    # -------------------------------------------------------
    # DELETE — rerun (idempotency)
    # -------------------------------------------------------
    - name: Delete SageMaker Image (Second Run - Idempotency)
      amazon.ai.sagemaker_image:
        state: absent
        image_name: "{{ image_name }}"
      register: image_delete_second

    - name: Assert delete idempotency
      ansible.builtin.assert:
        that:
          - not image_delete_second.changed
          - "'does not exist' in image_delete_second.msg"

  always:
    - name: Cleanup - Delete sort validation SageMaker Image
      amazon.ai.sagemaker_image:
        state: absent
        image_name: "{{ image_name }}-sort"
      ignore_errors: true

    - name: Cleanup - Delete SageMaker Image
      amazon.ai.sagemaker_image:
        state: absent
        image_name: "{{ image_name }}"
      ignore_errors: true

    - name: Cleanup - Delete IAM instance profile for SageMaker Image
      amazon.aws.iam_instance_profile:
        name: "{{ image_role_name }}"
        state: absent
      ignore_errors: true

    - name: Cleanup - Delete IAM role for SageMaker Image
      amazon.aws.iam_role:
        name: "{{ image_role_name }}"
        state: absent
      ignore_errors: true

---
# AI/ML

amazon.ai.bedrock_agent_info:
  query: >-
    .agents[] | select(. != null) |
    {
      canonical_facts: {
        id: .agent_id,
        name: .agent_name,
        tags: (.tags // {}),
        status: .agent_status
      },
      facts: {
        infra_type: "public_cloud",
        infra_bucket: "machine_learning",
        device_type: "ai_agent"
      }
    }


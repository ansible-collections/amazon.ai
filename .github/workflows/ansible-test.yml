# Ansible collection testing with ansible-test-gh-action
#
# Note: Integration tests are handled separately via Zuul due to their
# complexity and duration.
---
name: ansible-test

on: [workflow_call]  # allow this workflow to be called from other workflows

jobs:
  sanity:
    # devel fails to start ansible-test's default container on the 7.0 azure kernel of
    # ubuntu-24.04+ runners (https://github.com/ansible/ansible/issues/87731). Run it on
    # ubuntu-22.04 (6.8 kernel); revert once the issue is fixed.
    runs-on: ${{ matrix.ansible-core-version == 'devel' && 'ubuntu-22.04' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        ansible-core-version:
          - stable-2.18
          - stable-2.19
          - stable-2.20
          - stable-2.21
          - milestone
          - devel
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15"
        exclude:
          # devel and milestone don't support older Python versions
          - ansible-core-version: devel
            python-version: "3.11"
          - ansible-core-version: devel
            python-version: "3.12"
          - ansible-core-version: milestone
            python-version: "3.11"
          - ansible-core-version: milestone
            python-version: "3.12"
          # stable-2.21 excludes
          - ansible-core-version: stable-2.21
            python-version: "3.11"
          - ansible-core-version: stable-2.21
            python-version: "3.15"
          # stable-2.20 excludes
          - ansible-core-version: stable-2.20
            python-version: "3.11"
          - ansible-core-version: stable-2.20
            python-version: "3.15"
          # stable-2.19 excludes
          - ansible-core-version: stable-2.19
            python-version: "3.14"
          - ansible-core-version: stable-2.19
            python-version: "3.15"
          # stable-2.18 excludes
          - ansible-core-version: stable-2.18
            python-version: "3.14"
          - ansible-core-version: stable-2.18
            python-version: "3.15"
    steps:
      - name: Perform sanity testing
        uses: ansible-community/ansible-test-gh-action@6ded727edb598e670ac056a8e680ca4050bac0a3 # v1.18.0
        with:
          ansible-core-version: ${{ matrix.ansible-core-version }}
          testing-type: sanity
          target-python-version: ${{ matrix.python-version }}
          test-deps: -r ansible_collections/amazon/ai/tests/sanity/requirements.yml

  units:
    # devel fails to start ansible-test's default container on the 7.0 azure kernel of
    # ubuntu-24.04+ runners (https://github.com/ansible/ansible/issues/87731). Run it on
    # ubuntu-22.04 (6.8 kernel); revert once the issue is fixed.
    runs-on: ${{ matrix.ansible-core-version == 'devel' && 'ubuntu-22.04' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        ansible-core-version:
          - stable-2.18
          - stable-2.19
          - stable-2.20
          - stable-2.21
          - milestone
          - devel
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15"
        exclude:
          # devel and milestone don't support older Python versions
          - ansible-core-version: devel
            python-version: "3.11"
          - ansible-core-version: devel
            python-version: "3.12"
          - ansible-core-version: milestone
            python-version: "3.11"
          - ansible-core-version: milestone
            python-version: "3.12"
          # stable-2.21 excludes
          - ansible-core-version: stable-2.21
            python-version: "3.11"
          - ansible-core-version: stable-2.21
            python-version: "3.15"
          # stable-2.20 excludes
          - ansible-core-version: stable-2.20
            python-version: "3.11"
          - ansible-core-version: stable-2.20
            python-version: "3.15"
          # stable-2.19 excludes
          - ansible-core-version: stable-2.19
            python-version: "3.14"
          - ansible-core-version: stable-2.19
            python-version: "3.15"
          # stable-2.18 excludes
          - ansible-core-version: stable-2.18
            python-version: "3.14"
          - ansible-core-version: stable-2.18
            python-version: "3.15"
    steps:
      - name: Perform unit testing
        uses: ansible-community/ansible-test-gh-action@6ded727edb598e670ac056a8e680ca4050bac0a3 # v1.18.0
        with:
          ansible-core-version: ${{ matrix.ansible-core-version }}
          testing-type: units
          target-python-version: ${{ matrix.python-version }}
          test-deps: -r ansible_collections/amazon/ai/tests/unit/requirements.yml
